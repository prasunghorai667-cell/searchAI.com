<!DOCTYPE html>
<html>
<head>
    <title>searchAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🔍 searchAI</h1>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search AI tools (e.g., 'best AI for video editing')...">
        <button onclick="searchAI()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </svg>
        </button>
    </div>
    <p class="search-hint">Try: "video editing", "coding assistant", "image generation"</p>
</header>

<section class="news">
    <h2>📰 Latest AI News</h2>
    <div class="card">
        <h3>OpenAI launches new GPT model</h3>
        <p>New AI model improves reasoning and coding.</p>
    </div>

    <div class="card">
        <h3>Google Gemini updates</h3>
        <p>Gemini AI now supports multimodal features.</p>
    </div>
</section>

<section class="videos">
    <h2>🎬 AI Learning Videos</h2>

    <iframe width="400" height="250"
        src="https://www.youtube.com/embed/aircAruvnKk"
        allowfullscreen>
    </iframe>

    <iframe width="400" height="250"
        src="https://www.youtube.com/embed/2ePf9rue1Ao"
        allowfullscreen>
    </iframe>
</section>

<section id="results"></section>

<script type="module" src="script.js"></script>

</body>
</html>
