<header>
    <div class="header-bar">

        <button class="back-btn" id="backBtn" onclick="clearSearch()" style="display: none;">

        </button>
    </div>
    <div class="search-container">
        <div class="search-wrapper">

        </div>
    </div>
    <p class="search-hint">Try: "video editing", "coding", "image generation"</p>
</header>
